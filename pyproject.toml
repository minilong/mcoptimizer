[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcoptimizer"
version = "0.1.0"
description = "McDonald's order optimization engine on top of the official mcd-mcp server: knapsack DP and ILP for budget/nutrition/coupon-optimal combos."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "minilong" }]
keywords = ["mcdonalds", "mcp", "optimization", "knapsack", "ilp", "cli"]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "pydantic>=2.6",
    "mcp>=1.2",
]

[project.optional-dependencies]
ilp = ["pulp>=2.8,<3"]
dev = ["pytest>=8.0", "ruff>=0.4", "pulp>=2.8,<3"]

[project.scripts]
mcoptimizer = "mcoptimizer.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mcoptimizer = ["sample_data/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E741"]
